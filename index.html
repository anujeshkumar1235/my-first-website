<!DOCTYPE html>
<html>
<head>
    <title>My First App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f5f9;
            padding: 40px 20px;
        }

        .app {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
        }

        h1 {
            color: #1769e0;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #1769e0;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
        }

        .menu {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .menu button {
            width: 100%;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="app">
        <h1>My First App 🚀</h1>

        <p>स्वागत है! यह मेरी पहली वेबसाइट है।</p>

        <button>Start</button>

        <div class="menu">
            <button onclick="openAI()">
    🤖 AI Chat
            </button>
            <button>🖼️ Image AI</button>
            <button>🎤 Voice AI</button>
            <button>⚙️ Settings</button>
        </div>
    </div>

<script>
    function openAI() {
        document.querySelector(".app").innerHTML = `
            <h1>🤖 AI Chat</h1>

            <p>यहाँ आप AI से बात कर सकते हैं।</p>

            <input
                type="text"
                id="message"
                placeholder="अपना सवाल लिखें..."
                style="
                    width: 90%;
                    padding: 14px;
                    border-radius: 10px;
                    border: 1px solid #ccc;
                    font-size: 16px;
                    margin-bottom: 12px;
                "
            >

            <button onclick="sendMessage()">
                भेजें
            </button>

            <p id="answer"></p>

            <button onclick="location.reload()">
                🏠 Home
            </button>
        `;
    }

    function sendMessage() {
        let message = document.getElementById("message").value;

        if (message === "") {
            alert("पहले अपना सवाल लिखें।");
            return;
        }

        document.getElementById("answer").innerText =
            "आपने पूछा: " + message;
    }
</script>

</body>
</html>
