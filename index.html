<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f5f9;
            padding: 40px 20px;
        }

        .app {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1769e0;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #1769e0;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4fa8;
        }
    </style>
.menu {
    display: grid;
    gap: 12px;
    margin-top: 20px;
}

.menu button {
    width: 100%;
    font-size: 17px;
}
